<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent City</title>
<!--
  Agent City: the workspace drawn as a 3D city, beside the admin UI at / and
  Mate Office at /office/ (docs/dashboard.md section 12). Served by the
  console it can act too (CON-142): every Mate, crew, topic and project is a
  place, and one panel holds its buttons. A standalone `mate dashboard`
  answers read-only and the panel says so.

  Everything it loads is embedded in the binary and served from this origin:
  no build step, no CDN. three.js is vendored as one prebuilt ES module
  (vendor/three.js, its header says how it was built).
-->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="city.css">
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<header class="top">
  <div class="brand">
    <h1>Agent <span>City</span></h1>
    <p>click a Mate, a crew, a tent or City Hall · pins mark what needs you</p>
  </div>
  <div class="tools">
    <nav class="seg" aria-label="View">
      <a href="../" title="the admin dashboard">Admin</a>
      <a href="../office/" title="the same workspace drawn as an office">Office</a>
      <a class="on" href="./" aria-current="page">City</a>
    </nav>
    <button class="chip" id="needs" type="button" data-tone="ok"><span class="g" aria-hidden="true">&#9679;</span><span id="needs-n">Needs you</span><kbd>n</kbd></button>
    <button class="chip" id="goto" type="button" aria-label="Go to"><span class="g" aria-hidden="true">&#8981;</span><span>Go to</span><kbd>/</kbd></button>
    <button class="chip" id="sys" type="button" data-tone="ok"><span class="g" aria-hidden="true">&#9679;</span><span id="sys-t">System</span></button>
    <span class="chip live" id="live" data-state="loading" role="status" aria-live="polite"><span class="g" aria-hidden="true">&#9679;</span><span class="t">loading</span></span>
  </div>
</header>
<p class="boot" id="boot">loading&#8230;</p>
<p class="hidden-note" id="hidden"></p>
<nav id="rail" aria-label="Needs you"></nav>
<div id="pins" aria-label="Pins in the city"></div>
<aside id="dock" aria-labelledby="dock-title">
  <button class="grab" id="grab" type="button" aria-label="Resize panel"></button>
  <div class="dhead">
    <div style="min-width:0">
      <div class="crumbs" id="crumbs"></div>
      <h2 id="dock-title" tabindex="-1"></h2>
      <div class="sub" id="dock-sub"></div>
    </div>
    <button class="x" id="close" type="button" aria-label="Close panel (Escape)">&#10005;</button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>
<div id="scrub">
  <button id="play" type="button" aria-label="Pause">&#10074;&#10074;</button>
  <button id="speed" type="button" title="Playback speed">1&#215;</button>
  <div class="track"><div id="ticks"></div><input id="seek" type="range" min="0" max="1" step="any" value="1" aria-label="Time in the tent's history"></div>
  <span id="when"></span>
  <button id="golive" type="button" title="Jump to now (L)">Live</button>
</div>
<div id="scrim" role="presentation"></div>
<div id="tip"></div>
<p id="hint">Tab pins · Enter open · / go to · n next · h City Hall · Esc back</p>
<script type="module" src="app.js"></script>
</body>
</html>
